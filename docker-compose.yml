services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: sequelize-demo-app-postgis
    restart: on-failure:2
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - sequelize_demo_app_postgis_data:/var/lib/postgresql/data
      - ./init-hstore.sql:/docker-entrypoint-initdb.d/init-hstore.sql  # Initialization scripts only run when the data volume is empty.


volumes:
  sequelize_demo_app_postgis_data:
